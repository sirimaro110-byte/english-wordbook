<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英単語帳アプリ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>📚 英単語帳</h1>

    <!-- Unit選択 -->
    <select id="unitSelect">
        <option value="all">すべて</option>
        <option value="2026-06-19">2026-06-19</option>
        <option value="2026-06-26">2026-06-26</option>
        <option value="2026-07-10">2026-07-10</option>
        <option value="2026-07-17">2026-07-17</option>
    </select>

    <!-- 問題カード -->
    <div id="card">
        <h2 id="question">Loading...</h2>
        <p id="answer"></p>
    </div>

    <!-- ボタン -->
    <div class="buttons">
        <button id="showBtn">答えを見る</button>
        <button id="nextBtn">次の問題</button>
    </div>

    <!-- JavaScript -->
    <script src="words.js"></script>
    <script src="app.js"></script>

</body>
</html>
